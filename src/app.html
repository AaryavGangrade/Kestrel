<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kestrel Warranty Review</title>
<style>body{font-family:system-ui,Segoe UI,sans-serif;background:#f4f7fb;color:#18212f;margin:0}.wrap{max-width:980px;margin:32px auto;padding:0 20px}.card{background:white;border:1px solid #dce3ed;border-radius:14px;padding:24px;box-shadow:0 6px 22px #1d35570e}h1{margin:0 0 6px;color:#143d59}p{color:#526171}form{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}label{font-size:12px;color:#526171}input,select{width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{margin-top:18px;padding:12px 18px;border:0;border-radius:8px;background:#176b87;color:#fff;font-weight:700;cursor:pointer}.result{margin-top:20px;padding:17px;border-radius:10px;background:#eef8f4;display:none}.score{font-size:30px;font-weight:750;color:#0d5b47}.warn{background:#fff6e8}.error{background:#fff0f0;color:#9b1c1c}li{margin:7px 0}</style></head>
<body><div class="wrap"><div class="card"><h1>Kestrel warranty claim review</h1><p>Enter one claim. The score prioritizes the limited investigation queue; it is not an automatic denial.</p>
<form id="f"><label>Claim ID<input name="claim_id" value="DEMO-001" required></label><label>Submitted at<input name="submitted_at" type="datetime-local" value="2026-07-15T10:00" required></label><label>Partner ID<input name="partner_id" value="SP3207" required></label><label>SKU<input name="sku" value="KH-AF-01" required></label><label>Product serial<input name="product_serial" value="KH123456789" required></label><label>Days since purchase<input name="days_since_purchase" type="number" value="120" required></label><label>Claim amount (Rs)<input name="claim_amount_inr" type="number" value="3500" required></label><label>Photo attached<select name="photo_attached"><option>Y</option><option>N</option></select></label><label>Partner inspected<select name="partner_inspected"><option>Y</option><option>N</option></select></label><label>Fault description<input name="claim_description" value="motor not running" required></label><label>Prior claims<input name="customer_prior_claims" type="number" value="0" required></label><label>Source<input name="source" value="crm" required></label><label style="grid-column:1/-1">Inspector note<input name="inspector_note" value=""></label></form><button id="go">Score claim</button><div id="out" class="result"></div></div></div>
<script>const f=document.querySelector('#f'),out=document.querySelector('#out');document.querySelector('#go').onclick=async()=>{const o={};new FormData(f).forEach((v,k)=>o[k]=['days_since_purchase','claim_amount_inr','customer_prior_claims'].includes(k)?Number(v):v);try{const r=await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}),d=await r.json();out.style.display='block';out.className='result '+(d.ok?'':'error');out.innerHTML=d.ok?`<div class="score">${(d.fraud_score*100).toFixed(2)} score</div><p><b>Rank this claim within the monthly queue</b></p><ul>${d.reasons.map(x=>`<li>${x}</li>`).join('')}</ul><small>${d.note}</small>`:`<b>${d.error}</b><p>${(d.missing_fields||[]).join(', ')}</p>`}catch(e){out.style.display='block';out.className='result error';out.textContent='Service unavailable. Start service.py and try again.'}};</script></body></html>
